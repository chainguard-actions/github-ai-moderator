name: Test basic usage with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with default inputs
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          spam-label: spam
          ai-label: ai-generated
          minimize-detected-comments: 'true'
          enable-spam-detection: 'true'
          enable-link-spam-detection: 'true'
          enable-ai-detection: 'true'
        continue-on-error: true
      - name: Assert action ran (may fail due to no real event payload)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to either succeed or fail gracefully
          # (no real GitHub Models token or event payload in test environment)
          # We just verify it was invoked without a hard crash from bad inputs
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
