name: Test basic usage - workflow_dispatch graceful exit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (workflow_dispatch should exit gracefully)
        id: action
        uses: .
        with:
          dry-run: 'true'
          enable-spam-detection: 'true'
          enable-link-spam-detection: 'true'
          enable-ai-detection: 'true'

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully (graceful exit for workflow_dispatch event)"
          echo "PASS"
