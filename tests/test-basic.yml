name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create mock event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "action": "opened",
            "issue": {
              "number": 1,
              "title": "Test issue",
              "body": "This is a test issue body.",
              "node_id": "I_test123"
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          spam-label: 'spam'
          ai-label: 'ai-generated'
          minimize-detected-comments: 'true'
          enable-spam-detection: 'true'
          enable-link-spam-detection: 'true'
          enable-ai-detection: 'true'
      - name: Assert action ran (may fail due to API limits in test env)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to missing GitHub Models API access in test env
          # We verify it at least attempted to run (not a setup/config error)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
