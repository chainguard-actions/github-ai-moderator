messages:
  - role: system
    content: |
      You are a content moderation system. Analyze the provided content
      and determine if it is spam or AI-generated.
  - role: user
    content: |
      Analyze this content:

      {{stdin}}
model: gpt-4o
responseFormat: json_schema
jsonSchema: |-
  {
    "name": "moderation_result",
    "strict": true,
    "schema": {
      "type": "object",
      "properties": {
        "reasoning": {
          "type": "string",
          "description": "Explanation of the analysis"
        },
        "is_spam": {
          "type": "boolean",
          "description": "Whether the content is spam"
        }
      },
      "additionalProperties": false,
      "required": ["reasoning", "is_spam"]
    }
  }
