name: Test comment event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          spam-label: spam
          ai-label: ai-generated

      - name: Assert action ran for comment event (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should attempt to run regardless of event type.
          # In act without real GitHub credentials, it may fail with an API error,
          # but it must not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran for issue_comment event, outcome=$OUTCOME"
