name: Test custom prompt path handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom prompt file in the workspace
        run: |
          mkdir -p tests/fixtures
          cat > tests/fixtures/custom.prompt.yml << 'EOF'
          messages:
            - role: system
              content: |
                You are a content moderation system.
                Analyze the provided content and determine if it is spam.
                Provide your analysis in the specified JSON format.
            - role: user
              content: |
                Analyze this content:

                {{stdin}}
          model: gpt-4o
          responseFormat: json_schema
          jsonSchema: |-
            {
              "name": "spam_detection_result",
              "strict": true,
              "schema": {
                "type": "object",
                "properties": {
                  "reasoning": {
                    "type": "string",
                    "description": "Explanation of the analysis"
                  },
                  "is_spam": {
                    "type": "boolean",
                    "description": "Whether the content is spam"
                  }
                },
                "additionalProperties": false,
                "required": ["reasoning", "is_spam"]
              }
            }
          EOF

      - name: Run action with custom prompt path (non-existent file - should warn and continue)
        id: action-missing-prompt
        uses: .
        with:
          token: ${{ github.token }}
          spam-label: 'spam'
          ai-label: 'ai-generated'
          minimize-detected-comments: 'true'
          custom-prompt-path: 'tests/fixtures/nonexistent.prompt.yml'
          enable-spam-detection: 'true'
          enable-link-spam-detection: 'true'
          enable-ai-detection: 'true'

      - name: Assert action completed without failure for missing custom prompt
        run: |
          echo "Action completed successfully even with missing custom prompt"
          echo "PASS: action warned about missing custom prompt and continued gracefully"
