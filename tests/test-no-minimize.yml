name: Test minimize-detected-comments disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with comment minimization disabled
        id: action
        uses: .
        with:
          dry-run: 'true'
          minimize-detected-comments: 'false'
          enable-spam-detection: 'true'
          enable-link-spam-detection: 'true'
          enable-ai-detection: 'true'

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully with minimize-detected-comments=false"
          echo "PASS"
