name: Test custom label names
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom label names
        id: action
        uses: .
        with:
          dry-run: 'true'
          spam-label: 'junk'
          ai-label: 'bot-generated'
          minimize-detected-comments: 'false'

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully with custom label names"
          echo "PASS"
