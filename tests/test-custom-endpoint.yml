name: Test custom endpoint configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom endpoint (should exit gracefully before making API calls)
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          spam-label: 'spam'
          ai-label: 'ai-generated'
          minimize-detected-comments: 'true'
          enable-spam-detection: 'true'
          enable-link-spam-detection: 'true'
          enable-ai-detection: 'true'
          endpoint: 'https://models.github.ai/inference'

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully with custom endpoint"
          echo "PASS: action accepted custom endpoint input and exited gracefully"
