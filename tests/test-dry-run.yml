name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock issue event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/issue.json <<'EOF'
          {
            "action": "opened",
            "issue": {
              "number": 1,
              "title": "Test issue",
              "body": "This is a test issue body for dry-run testing.",
              "user": {
                "login": "test-user"
              },
              "labels": []
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/issue.json" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          dry-run: 'true'
          spam-label: 'spam'
          ai-label: 'ai-generated'
          minimize-detected-comments: 'false'
          enable-spam-detection: 'true'
          enable-link-spam-detection: 'true'
          enable-ai-detection: 'true'
        continue-on-error: true

      - name: Assert action ran (dry-run should not crash on missing API)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # In dry-run mode the action should either succeed or fail gracefully
          # We accept both success and failure since the GitHub Models API
          # may not be available in the test environment
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
